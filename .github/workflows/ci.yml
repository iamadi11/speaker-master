name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test package
        run: swift test --package-path .
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build macOS app
        run: |
          cd App
          xcodegen generate
          xcodebuild \
            -project SpeakerMaster.xcodeproj \
            -scheme SpeakerMasterApp \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build
