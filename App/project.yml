name: SpeakerMaster
options:
  bundleIdPrefix: com.iamadi11
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  SpeakerMasterPackage:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  SpeakerMasterApp:
    type: application
    platform: macOS
    sources:
      - path: SpeakerMaster
        excludes:
          - README.md
          - Info.plist
    info:
      path: SpeakerMaster/Info.plist
    settings:
      base:
        PRODUCT_NAME: SpeakerMaster
        PRODUCT_MODULE_NAME: SpeakerMasterApp
        PRODUCT_BUNDLE_IDENTIFIER: com.iamadi11.SpeakerMaster
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SpeakerMaster/SpeakerMaster.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: SpeakerMaster/SpeakerMaster.entitlements
    dependencies:
      - package: SpeakerMasterPackage
        product: SpeakerMaster
    scheme:
      testTargets: []
